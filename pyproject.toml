[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "finconrank-research-code"
version = "0.1.0"
description = "Financial query-constraint-aware visual reranking research code"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]
